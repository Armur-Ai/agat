[workspace]
resolver = "2"
members = [
    "crates/agat-core",
    "crates/agat-store",
    "crates/agat-cli",
    "crates/agat-tui",
    "crates/agat-static",
    "crates/agat-disasm",
    "crates/agat-poly",
    "crates/agat-meta",
    "crates/agat-ai",
    "crates/agat-antigen",
    "crates/agat-immune",
    "crates/agat-engine",
    "crates/agat-sandbox",
    "crates/agat-rewriter",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/Armur-Ai/agat"
authors = ["The agat authors"]
rust-version = "1.80"

[workspace.dependencies]
agat-core = { path = "crates/agat-core" }
agat-store = { path = "crates/agat-store" }
agat-static = { path = "crates/agat-static" }
agat-disasm = { path = "crates/agat-disasm" }
agat-poly = { path = "crates/agat-poly" }
agat-meta = { path = "crates/agat-meta" }
agat-ai = { path = "crates/agat-ai" }
agat-antigen = { path = "crates/agat-antigen" }
agat-immune = { path = "crates/agat-immune" }
agat-engine = { path = "crates/agat-engine" }
agat-tui = { path = "crates/agat-tui" }

anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

sha2 = "0.10"
md-5 = "0.10"
aes-gcm = "0.10"
argon2 = "0.5"
hex = "0.4"
zeroize = "1.8"
rand = "0.8"

goblin = "0.8"
iced-x86 = "1.21"
petgraph = "0.6"

chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
dirs = "5.0"

clap = { version = "4.5", features = ["derive"] }
rpassword = "7.3"

ratatui = "0.29"
crossterm = "0.28"

rusqlite = { version = "0.32", features = ["bundled"] }

toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
