name: Feature request
description: Propose a capability, integration, or analyzer.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Who runs into it, and what do they do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: Works fully offline (no network calls)
          required: true
        - label: Defensive scope (no evasion or weaponization)
          required: true
