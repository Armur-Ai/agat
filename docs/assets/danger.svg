<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-label="the danger axis: a dendritic cell fuses PAMP, danger and safe signals into a costimulation gate and a mature-versus-semimature ratio, which decide the danger context">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03050b"/><stop offset="1" stop-color="#0c0a1d"/></linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#5ef2ff" fill-opacity="0.06"/></pattern>
    <radialGradient id="dc" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8fa8ff" stop-opacity="0.26"/><stop offset="1" stop-color="#8fa8ff" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5a6b8c"/></marker>
    <style>
      .t    { font:12px ui-monospace,Menlo,monospace; fill:#93a4cc; }
      .sm   { font:10.5px ui-monospace,Menlo,monospace; fill:#6b7ca3; }
      .h    { font:700 15px ui-monospace,Menlo,monospace; fill:#e8efff; }
      .lab  { font:700 12px ui-monospace,Menlo,monospace; }
      .eq   { font:700 12.5px ui-monospace,Menlo,monospace; fill:#cfe0ff; }
      .ctx  { font:700 12px ui-monospace,Menlo,monospace; }
    </style>
  </defs>
  <rect width="1000" height="540" fill="url(#bg)"/><rect width="1000" height="540" fill="url(#dots)"/>

  <text x="500" y="40" text-anchor="middle" class="h">The danger axis — a dendritic cell weighs the context, not the code</text>
  <text x="500" y="62" text-anchor="middle" class="t">signals never attack on their own; they gate and tilt a single maturation decision</text>

  <!-- three signal inputs (left) -->
  <!-- PAMP -->
  <g>
    <rect x="40" y="110" width="210" height="80" rx="10" fill="#140811" stroke="#ff5c7a" stroke-opacity="0.55"/>
    <text x="56" y="134" class="lab" fill="#ff5c7a">PAMP signals</text>
    <text x="56" y="154" class="sm">packer sections · injection imports</text>
    <text x="56" y="170" class="sm">self-modifying code · anti-analysis</text>
    <text x="56" y="184" class="sm" fill="#ff5c7a">→ almost surely pathogenic</text>
  </g>
  <!-- Danger -->
  <g>
    <rect x="40" y="228" width="210" height="80" rx="10" fill="#141005" stroke="#f2c14e" stroke-opacity="0.55"/>
    <text x="56" y="252" class="lab" fill="#f2c14e">Danger signals</text>
    <text x="56" y="272" class="sm">high-entropy exec sections</text>
    <text x="56" y="288" class="sm">stress / damage markers</text>
    <text x="56" y="302" class="sm" fill="#f2c14e">→ suggestive, not conclusive</text>
  </g>
  <!-- Safe -->
  <g>
    <rect x="40" y="346" width="210" height="80" rx="10" fill="#07140f" stroke="#2bd99a" stroke-opacity="0.55"/>
    <text x="56" y="370" class="lab" fill="#2bd99a">Safe signals</text>
    <text x="56" y="390" class="sm">signed · known-good layout</text>
    <text x="56" y="406" class="sm">healthy, normal context</text>
    <text x="56" y="420" class="sm" fill="#2bd99a">→ tolerogenic, dampening</text>
  </g>

  <!-- arrows into DC -->
  <line x1="250" y1="150" x2="372" y2="235" stroke="#5a6b8c" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="250" y1="268" x2="372" y2="268" stroke="#5a6b8c" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="250" y1="386" x2="372" y2="300" stroke="#5a6b8c" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- dendritic cell node (middle) -->
  <circle cx="470" cy="268" r="96" fill="url(#dc)"/>
  <circle cx="470" cy="268" r="70" fill="none" stroke="#8fa8ff" stroke-width="1.5" stroke-opacity="0.8" stroke-dasharray="5 4" filter="url(#soft)"/>
  <text x="470" y="238" text-anchor="middle" class="lab" fill="#cfe0ff">dendritic cell</text>
  <text x="470" y="262" text-anchor="middle" class="sm" fill="#8fa8ff">csm = 2p + d + 2s</text>
  <text x="470" y="282" text-anchor="middle" class="sm" fill="#ff8fa6">mat = 2p + d</text>
  <text x="470" y="302" text-anchor="middle" class="sm" fill="#6fe3b6">semi = 2s</text>

  <!-- CSM migration gate -->
  <line x1="540" y1="230" x2="628" y2="168" stroke="#5a6b8c" stroke-width="1.4" marker-end="url(#arr)"/>
  <g>
    <rect x="628" y="118" width="214" height="86" rx="10" fill="#0a1222" stroke="#5ef2ff" stroke-opacity="0.5"/>
    <text x="644" y="142" class="lab" fill="#5ef2ff">migration gate</text>
    <text x="644" y="164" class="eq">csm̄ = csm / 5</text>
    <text x="644" y="184" class="sm">below 0.10 → too little context</text>
    <text x="644" y="198" class="sm" fill="#8a9bc4">verdict = inconclusive, no alarm</text>
  </g>

  <!-- danger score ratio -->
  <line x1="540" y1="306" x2="628" y2="366" stroke="#5a6b8c" stroke-width="1.4" marker-end="url(#arr)"/>
  <g>
    <rect x="628" y="330" width="214" height="86" rx="10" fill="#120a16" stroke="#d07bff" stroke-opacity="0.5"/>
    <text x="644" y="354" class="lab" fill="#d07bff">maturation ratio</text>
    <text x="644" y="376" class="eq">danger = mat / (mat + semi)</text>
    <text x="644" y="396" class="sm">per-antigen MCAV analogue</text>
    <text x="644" y="410" class="sm" fill="#8a9bc4">safe signals pull it toward 0</text>
  </g>

  <!-- context decision ladder (right) -->
  <line x1="842" y1="161" x2="890" y2="200" stroke="#5a6b8c" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="842" y1="373" x2="890" y2="320" stroke="#5a6b8c" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="910" y="150" text-anchor="middle" class="t" fill="#93a4cc">context</text>
  <g text-anchor="middle">
    <rect x="862" y="196" width="96" height="26" rx="6" fill="#0d1526" stroke="#5a6b8c" stroke-opacity="0.6"/>
    <text x="910" y="213" class="ctx" fill="#8a9bc4">inconclusive</text>
    <rect x="862" y="232" width="96" height="26" rx="6" fill="#07140f" stroke="#2bd99a" stroke-opacity="0.6"/>
    <text x="910" y="249" class="ctx" fill="#2bd99a">safe &lt; 0.33</text>
    <rect x="862" y="268" width="96" height="26" rx="6" fill="#141005" stroke="#f2c14e" stroke-opacity="0.6"/>
    <text x="910" y="285" class="ctx" fill="#f2c14e">ambiguous</text>
    <rect x="862" y="304" width="96" height="26" rx="6" fill="#1a0810" stroke="#ff5c7a" stroke-opacity="0.7"/>
    <text x="910" y="321" class="ctx" fill="#ff5c7a">dangerous ≥ 0.50</text>
  </g>

  <text x="500" y="470" text-anchor="middle" class="t">This danger context is one axis. agat fuses it with recognition (self / non-self) for the final severity.</text>
  <text x="500" y="492" text-anchor="middle" class="sm">every weight and threshold is a default in agat-immune/src/danger.rs — tunable, inspectable, offline</text>
</svg>
