<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="agat — an adaptive immune system for binaries">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03050b"/><stop offset="0.55" stop-color="#070c1a"/><stop offset="1" stop-color="#0d0a1f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ef2ff"/><stop offset="0.5" stop-color="#8fa8ff"/><stop offset="1" stop-color="#d07bff"/>
    </linearGradient>
    <radialGradient id="self" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2bd99a" stop-opacity="0.30"/><stop offset="1" stop-color="#2bd99a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mem" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4fd8" stop-opacity="0.28"/><stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#5ef2ff" fill-opacity="0.08"/></pattern>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <!-- self region, left -->
  <ellipse cx="150" cy="330" rx="170" ry="150" fill="url(#self)"/>
  <g fill="#2bd99a" fill-opacity="0.8">
    <circle cx="110" cy="300" r="3"/><circle cx="150" cy="350" r="3"/><circle cx="190" cy="310" r="3"/>
    <circle cx="130" cy="390" r="3"/><circle cx="205" cy="365" r="3"/><circle cx="95" cy="350" r="3"/>
  </g>
  <text x="112" y="470" font-family="ui-monospace,Menlo,monospace" font-size="13" letter-spacing="4" fill="#2bd99a" fill-opacity="0.75">SELF</text>

  <!-- detectors + memory cell, right -->
  <g fill="none" stroke="#5ef2ff" stroke-width="1.3" filter="url(#soft)">
    <circle cx="1050" cy="180" r="66" stroke-opacity="0.32"/>
    <circle cx="1170" cy="250" r="78" stroke-opacity="0.28"/>
    <circle cx="1095" cy="360" r="60" stroke-opacity="0.3"/>
  </g>
  <circle cx="1150" cy="410" r="72" fill="url(#mem)"/>
  <circle cx="1150" cy="410" r="72" fill="none" stroke="#ff4fd8" stroke-width="1.6" stroke-opacity="0.85" stroke-dasharray="5 4" filter="url(#soft)"/>
  <g fill="#ff4fd8"><circle cx="1125" cy="395" r="3.2"/><circle cx="1165" cy="388" r="3.2"/><circle cx="1178" cy="424" r="3.2"/><circle cx="1138" cy="432" r="3.2"/><circle cx="1150" cy="408" r="3.2"/></g>
  <circle cx="1188" cy="398" r="5" fill="#fff" filter="url(#glow)"/>
  <circle cx="1188" cy="398" r="11" fill="none" stroke="#fff" stroke-opacity="0.6"/>
  <text x="1086" y="506" font-family="ui-monospace,Menlo,monospace" font-size="13" letter-spacing="3" fill="#ff4fd8" fill-opacity="0.8">MEMORY CELL</text>

  <!-- title -->
  <text x="640" y="300" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="150" font-weight="700" letter-spacing="30" fill="url(#title)" filter="url(#glow)">agat</text>
  <text x="640" y="360" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="22" letter-spacing="6" fill="#d8e4ff">AN ADAPTIVE IMMUNE SYSTEM FOR BINARIES</text>
  <line x1="420" y1="390" x2="860" y2="390" stroke="url(#title)" stroke-width="1" stroke-opacity="0.55"/>
  <text x="640" y="424" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="15" letter-spacing="1.5" fill="#8a9bc4">catches polymorphic · metamorphic · AI-rewritten variants</text>
  <text x="640" y="450" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="13" letter-spacing="2" fill="#5a6b8c">offline · air-gapped · one static binary · Rust</text>
</svg>
