<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="agat fuses two independent axes — recognition (is it non-self?) and danger (is it harmful?) — into one severity">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03050b"/>
      <stop offset="1" stop-color="#0c0a1d"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#5ef2ff" fill-opacity="0.06"/>
    </pattern>
    <style>
      .t    { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #93a4cc; }
      .h    { font: 700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1px; fill: #e8efff; }
      .axis { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 3px; }
      .cell { font: 700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1px; }
      .sub  { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0c0a1d; fill-opacity: .75; }
      .lab  { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #c3cfe8; }
    </style>
  </defs>

  <rect width="1000" height="560" fill="url(#bg)"/>
  <rect width="1000" height="560" fill="url(#dots)"/>

  <text x="500" y="46" text-anchor="middle" class="h">Two axes, fused only at the end</text>
  <text x="500" y="70" text-anchor="middle" class="t">recognition and danger are judged separately, so you can disagree with the call</text>

  <!-- Y axis label: recognition -->
  <text x="40" y="300" class="axis" fill="#2bd99a" transform="rotate(-90 40 300)" text-anchor="middle">RECOGNITION  ·  is it non-self?</text>
  <!-- X axis label: danger -->
  <text x="560" y="540" class="axis" fill="#ff5c7a" text-anchor="middle">DANGER  ·  is it harmful?</text>

  <!-- column headers -->
  <text x="330" y="118" text-anchor="middle" class="lab">safe</text>
  <text x="560" y="118" text-anchor="middle" class="lab">ambiguous</text>
  <text x="790" y="118" text-anchor="middle" class="lab">dangerous</text>

  <!-- row headers -->
  <text x="150" y="196" text-anchor="middle" class="lab">non-self</text>
  <text x="150" y="420" text-anchor="middle" class="lab">self /</text>
  <text x="150" y="438" text-anchor="middle" class="lab">unknown</text>

  <!-- grid cells: x = 230,460,690 width 210; y = 135,360 height 190 -->
  <!-- row non-self -->
  <g>
    <rect x="228" y="135" width="204" height="190" rx="10" fill="#1a2436" stroke="#5ef2ff" stroke-opacity=".4"/>
    <text x="330" y="222" text-anchor="middle" class="cell" fill="#5ef2ff">REVIEW</text>
    <text x="330" y="246" text-anchor="middle" class="sub" fill="#9fb6d8">unusual, but calm</text>
    <text x="330" y="262" text-anchor="middle" class="sub" fill="#9fb6d8">false-positive guard</text>

    <rect x="456" y="135" width="204" height="190" rx="10" fill="#4a3b12" stroke="#ffc857" stroke-opacity=".6"/>
    <text x="560" y="222" text-anchor="middle" class="cell" fill="#ffc857">SUSPICIOUS</text>
    <text x="560" y="246" text-anchor="middle" class="sub">triage</text>

    <rect x="684" y="135" width="204" height="190" rx="10" fill="#4a1420" stroke="#ff5c7a"/>
    <text x="790" y="222" text-anchor="middle" class="cell" fill="#ff5c7a">MALICIOUS</text>
    <text x="790" y="246" text-anchor="middle" class="sub">both axes agree</text>
    <text x="790" y="262" text-anchor="middle" class="sub">investigate now</text>
  </g>
  <!-- row self -->
  <g>
    <rect x="228" y="359" width="204" height="150" rx="10" fill="#0f3320" stroke="#2ecc71" stroke-opacity=".6"/>
    <text x="330" y="440" text-anchor="middle" class="cell" fill="#2ecc71">CLEAN</text>
    <text x="330" y="464" text-anchor="middle" class="sub" fill="#9fb6d8">no action</text>

    <rect x="456" y="359" width="204" height="150" rx="10" fill="#1a2436" stroke="#5ef2ff" stroke-opacity=".4"/>
    <text x="560" y="440" text-anchor="middle" class="cell" fill="#5ef2ff">REVIEW</text>
    <text x="560" y="464" text-anchor="middle" class="sub" fill="#9fb6d8">anomaly worth a look</text>

    <rect x="684" y="359" width="204" height="150" rx="10" fill="#1a2436" stroke="#5ef2ff" stroke-opacity=".4"/>
    <text x="790" y="440" text-anchor="middle" class="cell" fill="#5ef2ff">REVIEW</text>
    <text x="790" y="464" text-anchor="middle" class="sub" fill="#9fb6d8">within self, yet</text>
    <text x="790" y="480" text-anchor="middle" class="sub" fill="#9fb6d8">dangerous signals</text>
  </g>
</svg>
