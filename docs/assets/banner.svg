<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="agat — an adaptive immune system for binaries">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03050b"/>
      <stop offset="0.55" stop-color="#070c1a"/>
      <stop offset="1" stop-color="#0d0a1f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ef2ff"/>
      <stop offset="0.5" stop-color="#8fa8ff"/>
      <stop offset="1" stop-color="#d07bff"/>
    </linearGradient>
    <radialGradient id="self" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2bd99a" stop-opacity="0.35"/>
      <stop offset="0.7" stop-color="#2bd99a" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#2bd99a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="memory" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4fd8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#5ef2ff" fill-opacity="0.10"/>
    </pattern>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#dots)"/>

  <!-- antigen space: the benign "self" region (left) -->
  <ellipse cx="170" cy="190" rx="170" ry="130" fill="url(#self)"/>
  <g fill="#2bd99a" fill-opacity="0.75">
    <circle cx="120" cy="160" r="3"/><circle cx="150" cy="205" r="3"/><circle cx="190" cy="175" r="3"/>
    <circle cx="210" cy="225" r="3"/><circle cx="105" cy="215" r="3"/><circle cx="165" cy="140" r="3"/>
    <circle cx="235" cy="185" r="3"/><circle cx="135" cy="250" r="3"/>
  </g>
  <text x="96" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="3" fill="#2bd99a" fill-opacity="0.7">SELF</text>

  <!-- negative-selection detectors tiling non-self (right) -->
  <g fill="none" stroke="#5ef2ff" stroke-width="1.2" filter="url(#softglow)">
    <circle cx="930" cy="90" r="58" stroke-opacity="0.35"/>
    <circle cx="1040" cy="130" r="72" stroke-opacity="0.30"/>
    <circle cx="1170" cy="80" r="64" stroke-opacity="0.35"/>
    <circle cx="1210" cy="230" r="80" stroke-opacity="0.25"/>
    <circle cx="960" cy="270" r="62" stroke-opacity="0.30"/>
  </g>

  <!-- a family memory cell: a covering ball over matured variants -->
  <circle cx="1085" cy="250" r="66" fill="url(#memory)"/>
  <circle cx="1085" cy="250" r="66" fill="none" stroke="#ff4fd8" stroke-width="1.6" stroke-opacity="0.85" stroke-dasharray="5 4" filter="url(#softglow)"/>
  <g fill="#ff4fd8">
    <circle cx="1060" cy="235" r="3.2"/><circle cx="1098" cy="226" r="3.2"/><circle cx="1110" cy="262" r="3.2"/>
    <circle cx="1072" cy="272" r="3.2"/><circle cx="1088" cy="248" r="3.2"/><circle cx="1050" cy="258" r="3.2"/>
  </g>
  <!-- the never-seen variant, caught by the memory cell -->
  <circle cx="1124" cy="236" r="5" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="1124" cy="236" r="11" fill="none" stroke="#ffffff" stroke-opacity="0.6"/>
  <text x="1012" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="3" fill="#ff4fd8" fill-opacity="0.8">MEMORY CELL</text>

  <!-- title block -->
  <text x="640" y="170" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="118" font-weight="700" letter-spacing="26" fill="url(#title)" filter="url(#glow)">agat</text>
  <text x="640" y="222" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="6" fill="#d8e4ff">AN ADAPTIVE IMMUNE SYSTEM FOR BINARIES</text>
  <line x1="470" y1="246" x2="810" y2="246" stroke="url(#title)" stroke-width="1" stroke-opacity="0.6"/>
  <text x="640" y="274" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2" fill="#8a9bc4">negative selection · clonal selection · danger theory</text>
  <text x="640" y="296" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2" fill="#8a9bc4">offline · air-gapped · one static binary</text>
</svg>
